# copy this to /etc/rlbs/rlbsd.conf for the system service, then edit capacity
# for the actual box. this is key = value on purpose, not a new language to
# learn before a job can run.

database = /var/lib/rlbs/rlbs.db
socket = /run/rlbs/rlbs.sock
socket_group = rlbs
spool = /var/lib/rlbs/spool

node-id = workstation
cpus = 4
memory-mb = 16000
gpus = 0

# preserve a little room for people using the workstation interactively.
reserve-cpus = 1
reserve-memory-mb = 2000
reserve-gpus = 0
tick-ms = 100
